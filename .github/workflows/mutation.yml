name: Mutation testing

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  stryker:
    name: Mutation test Core
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # MinVer reads tags to version the build
          persist-credentials: false # nothing here pushes over git

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Run Stryker on Core
        run: dotnet stryker -p src/KlattschSharp.Core/KlattschSharp.Core.csproj
        continue-on-error: true   # report-only for v0.x

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report
          path: StrykerOutput/**/*
          if-no-files-found: warn
